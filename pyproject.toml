[project]
name = "recomsphere-lastfm"
version = "0.1.0"
description = "Two-stage music recommendation engine using Last.fm 1K"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "pyarrow==17.0.0",
    "requests==2.32.3",
    "tqdm==4.67.1",
    "pyspark==4.0.1",
    "torch>=2.14.1",
    "faiss-cpu>=1.15.1",
    "scikit-learn>=1.9.1",
    "fastapi>=0.162.2",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
